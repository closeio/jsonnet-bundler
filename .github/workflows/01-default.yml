name: Default Workflow

on:
  push:
    branches:
      - '*'
    tags:
      - '**'
  pull_request:
    branches:
      - '*'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.24'
        check-latest: true
        cache: true
        cache-dependency-path: 'go.sum'

    - name: Check Go version
      run: go version

    - name: Go mod vendor
      run: go mod vendor

    - name: Git diff check
      run: git diff --exit-code

    - name: Build and Test
      run: |
        make build
        make test
        make test-integration

    - name: Check License  # and Generate
      run: |
        make check-license
        # make generate
        # git diff --exit-code

    - name: Cleanup
      run: go clean -modcache

    - name: Post Cleanup
      run: go clean -cache
